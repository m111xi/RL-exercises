# Hydra configuration for discrete SAC on LunarLander-v3.

env:
  name: LunarLander-v3

seed: 0

agent:
  lr_actor: 3e-4
  lr_critic: 3e-4
  lr_alpha: 3e-4
  gamma: 0.99
  tau: 0.005
  alpha: 0.2
  auto_alpha: true
  target_entropy: null
  hidden_size: 128
  replay_size: 100000
  batch_size: 128
  start_steps: 2000
  update_every: 1
  updates_per_step: 1

train:
  total_steps: 60000
  eval_interval: 10000
  eval_episodes: 5
